plugins {
    id 'com.android.application'
}

android {
    namespace 'space.arrival.splatxr'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'space.arrival.splatxr'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main.assets.srcDir "$buildDir/generated/webassets/www"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

def webAssetsDir = layout.buildDirectory.dir('generated/webassets/www')

tasks.register('syncWebAssets', Sync) {
    into webAssetsDir
    // This build script lives in android/app, so go up two levels to the
    // repository root before copying the web application and JS engine.
    from('../../app') { into 'app' }
    from('../../src') { into 'src' }
    if (rootProject.file('../data/synthetic').isDirectory()) {
        from('../data/synthetic') { into 'data/synthetic' }
    }
}

tasks.named('preBuild').configure { dependsOn tasks.named('syncWebAssets') }

dependencies {
    implementation 'com.google.ar:core:1.41.0'
    implementation 'androidx.webkit:webkit:1.12.1'
}
